{% extends "base.html" %}

{% block title %}Ajouter une Classe{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-4">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Ajouter une Classe</h2>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="nom" class="form-label">Nom de la classe</label>
                        <input type="text" name="nom" id="nom" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="niveau" class="form-label">Niveau</label>
                        <input type="text" name="niveau" id="niveau" class="form-control" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Créer</button>
                        <a href="{% url 'liste_classes' %}" class="btn btn-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
