{% extends "base.html" %}

{% block title %}Dashboard Responsable{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h2>Dashboard Responsable</h2>
            <p class="lead">Bienvenue, {{ user.username }} !</p>
            <hr>
        </div>
    </div>
    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card border-left-success shadow h-100 py-2">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-success text-uppercase mb-1">Élèves</div>
                            <a href="{% url 'liste_eleves' %}" class="btn btn-sm btn-success">Gérer les élèves</a>
                        </div>
                        <div class="col-auto">
                            <i class="bi bi-person-fill fa-2x text-gray-300" style="font-size: 2rem; color: #ccc;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-left-info shadow h-100 py-2">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-info text-uppercase mb-1">Notes</div>
                            <a href="{% url 'liste_notes' %}" class="btn btn-sm btn-info text-white">Gérer les notes</a>
                        </div>
                        <div class="col-auto">
                            <i class="bi bi-journal-check fa-2x text-gray-300" style="font-size: 2rem; color: #ccc;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
