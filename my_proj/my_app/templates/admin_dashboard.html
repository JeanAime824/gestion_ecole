{% extends "base.html" %}

{% block title %}Dashboard Administrateur{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h2>Dashboard Administrateur</h2>
            <p class="lead">Bienvenue, {{ user.username }} !</p>
            <hr>
        </div>
    </div>
    <div class="row mt-4">
        <div class="col-md-3">
            <div class="card border-left-primary shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">Responsables</div>
                            <a href="{% url 'ajouter_responsable' %}" class="btn btn-sm btn-primary">Gérer</a>
                        </div>
                        <div class="col-auto">
                            <i class="bi bi-people-fill fa-2x text-gray-300" style="font-size: 2rem; color: #ccc;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-left-success shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-success text-uppercase mb-1">Classes</div>
                            <a href="{% url 'liste_classes' %}" class="btn btn-sm btn-success">Gérer</a>
                        </div>
                        <div class="col-auto">
                            <i class="bi bi-door-open-fill fa-2x text-gray-300" style="font-size: 2rem; color: #ccc;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-left-info shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-info text-uppercase mb-1">Élèves</div>
                            <a href="{% url 'liste_eleves' %}" class="btn btn-sm btn-info text-white">Gérer</a>
                        </div>
                        <div class="col-auto">
                            <i class="bi bi-person-fill fa-2x text-gray-300" style="font-size: 2rem; color: #ccc;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-left-warning shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">Écolage</div>
                            <a href="{% url 'liste_paiements' %}" class="btn btn-sm btn-warning text-white">Paiements</a>
                        </div>
                        <div class="col-auto">
                            <i class="bi bi-cash-stack fa-2x text-gray-300" style="font-size: 2rem; color: #ccc;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
