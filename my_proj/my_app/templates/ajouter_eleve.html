{% extends "base.html" %}

{% block title %}Ajouter un Élève{% endblock %}

{% block content %}
<style>
    .form-control, .form-select {
        background-color: #0f172a;
        border: 1px solid #334155;
        color: #f8fafc;
    }
    .form-control:focus, .form-select:focus {
        background-color: #0f172a;
        border-color: #3b82f6;
        color: #f8fafc;
        box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
    }
</style>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">Nouveau Élève</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label text-muted small text-uppercase">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary px-4">Enregistrer</button>
                        <a href="{% url 'liste_eleves' %}" class="btn btn-outline-light px-4">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
