{% extends "base.html" %}

{% block title %}Liste des Classes{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Liste des Classes</h2>
    <a href="{% url 'ajouter_classe' %}" class="btn btn-primary">Ajouter une classe</a>
</div>

<div class="card">
    <div class="card-body">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Niveau</th>
                </tr>
            </thead>
            <tbody>
                {% for classe in classes %}
                <tr>
                    <td>{{ classe.nom }}</td>
                    <td>{{ classe.niveau }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2" class="text-center">Aucune classe trouvée.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
<div class="mt-3">
    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Retour au Dashboard</a>
</div>
{% endblock %}
